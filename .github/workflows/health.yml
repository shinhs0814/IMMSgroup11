name: Health

# Runs the project's "health stack" (typecheck + tests) on every push and PR.
# Mirrors what `/health` skill does locally so CI catches drift before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    name: typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: can_I_eat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
